[package]
name = "makepad-example-aichat"
version = "0.1.0"
authors = ["Makepad <info@makepad.nl>"]
edition = "2021"
description = "AI Chat example demonstrating makepad-ai library"
license = "MIT OR Apache-2.0"

[dependencies]
makepad-widgets = { path = "../../widgets", features = ["maps", "pdf"] }
makepad-code-editor = { path = "../../code_editor" }
makepad-ai = { path = "../../libs/makepad_ai" }
# NOTE: path dep (not git) because streaming-markdown-kit isn't yet
# published to crates.io. To build this example, clone it next to
# `makepad/`:
#     .../
#     ├── makepad/                 (this repo)
#     └── streaming-markdown-kit/  (git@github.com:Project-Robius-China/streaming-markdown-kit)
streaming-markdown-kit = { path = "../../../../streaming-markdown-kit", features = ["mermaid"] }

# Inline-diagram renderer. The `makepad` feature pulls in the Makepad-native
# `DiagramView` widget that turns a ```diagram-fenced JSON body into a
# painted pyramid/tree/flowchart/layers/quadrant. Path dep rather than a
# published release — lock-step with this fork's `dev` branch.
makepad-diagram-kit = { path = "../../../../makepad-diagram-kit", features = ["makepad"] }

# Cross-platform URL opener. std::process::Command only works on desktop —
# iOS/Android/WASM need platform-specific plumbing (UIApplication, Intent,
# window.open). robius-open is the Robius-ecosystem standard for this
# (used by robrix and moly).
robius-open = { git = "https://github.com/project-robius/robius" }
